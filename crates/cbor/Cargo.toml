[package]
name = "reallyme-codec-cbor"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Canonical CBOR codec support for ReallyMe Codec."
include = ["/src/**/*.rs", "/tests/**/*.rs", "/tests/fixtures/**", "/Cargo.toml", "/LICENSE", "/NOTICE"]

[lib]
name = "codec_cbor"

[dependencies]
cid = { workspace = true }
multihash = { workspace = true }
multihash-codetable = { workspace = true, features = ["sha2"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
stats_alloc = "=0.1.10"

[lints]
workspace = true
