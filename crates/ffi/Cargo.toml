[package]
name = "reallyme-codec-ffi"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ReallyMe native C ABI and JNI surface for Rust-backed codec operations."

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["jni"]
jni = ["dep:jni"]

[dependencies]
codec-adapter = { package = "reallyme-codec-adapter", version = "=0.3.0", path = "../adapter" }
codec-proto = { package = "reallyme-codec-proto", version = "=0.3.0", path = "../proto", features = ["generated"] }
codec-runtime = { package = "reallyme-codec", version = "=0.3.0", path = "../codec", default-features = false, features = ["operation-contract"] }
jni = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
buffa = { workspace = true }

[lints]
workspace = true
