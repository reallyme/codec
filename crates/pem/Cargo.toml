[package]
name = "reallyme-codec-pem"
version = "0.4.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "PEM text armor parsing and encoding for ReallyMe Codec."
readme = "README.md"
include = ["/src/**/*.rs", "/tests/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
name = "codec_pem"

[dependencies]
codec-proto = { package = "reallyme-codec-proto", version = "=0.4.4", path = "../proto", features = ["generated"] }
base64 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
pem = "=4.0.0"

[lints]
workspace = true
