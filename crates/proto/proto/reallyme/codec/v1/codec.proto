}

message CodecGeneralCborMap {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  repeated CodecGeneralCborMapEntry entries = 1;
}

message CodecGeneralCborTag {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  uint64 tag = 1;
  CodecGeneralCborValue value = 2;
}

// Received values embed their complete original encoding verbatim.
message CodecGeneralCborValue {
  oneof value {
    CodecGeneralCborUnsigned unsigned_value = 1;
    CodecGeneralCborNegative negative_value = 2;
    CodecBytesResult bytes_value = 3;
    CodecTextResult text_value = 4;
    CodecGeneralCborArray array_value = 5;
    CodecGeneralCborMap map_value = 6;
    CodecGeneralCborTag tag_value = 7;
    CodecGeneralCborFloat float_value = 8;
    CodecBoolResult bool_value = 9;
    CodecEmptyResult null_value = 10;
    CodecEmptyResult undefined_value = 11;
    CodecGeneralCborSimple simple_value = 12;
    CodecBytesResult received_value = 13;
  }
}

message CodecGeneralCborEncodeRequest {
  CodecGeneralCborValue value = 1;
  CodecGeneralCborOptions options = 2;
}

