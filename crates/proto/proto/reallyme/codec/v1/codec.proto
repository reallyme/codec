message CodecDerPairRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes encoded = 1;
  CodecDerLimits limits = 2;
}

// Read one prefix field; container and document exhaustion remain explicit schema operations.
message CodecDerReadRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes encoded = 1;
  CodecDerLimits limits = 2;
  CodecDerType kind = 3;
}

// INTEGER bytes retain the native signed representation or unsigned minimal magnitude.
message CodecDerValue {
  CodecDerType kind = 1;
  CodecByteSpan received = 2;
  CodecByteSpan contents = 3;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes bytes_value = 4;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  optional bool bool_value = 5;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  optional uint32 unused_bits = 6;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  repeated CodecDerValue children = 7;
}

message CodecDerReadResult {
  CodecDerValue value = 1;
  uint64 consumed_bytes = 2;
}

message CodecDerUnsignedIntegerPair {
  // SENSITIVE: payload ownership requires redaction and zeroization.
