syntax = "proto3";

package reallyme.codec.v1;

option java_multiple_files = true;
option java_package = "me.really.codec.v1";
option swift_prefix = "ReallyMeProto";

// CodecError is the public, non-PII error envelope for codec boundary failures.
// The oneof keeps base encoding, PEM, multiformat, and canonicalization
// failures distinct while the shared CodecErrorReason enum provides stable
// cross-language reason codes.
enum CodecErrorOrigin {
  CODEC_ERROR_ORIGIN_UNSPECIFIED = 0;
  CODEC_ERROR_ORIGIN_CALLER = 1;
  CODEC_ERROR_ORIGIN_PROVIDER = 2;
}

// Stable SDK presentation of codec and host-provider failures. Existing wire
// operations continue to report their more precise CodecErrorReason. SDK view
// generation uses the names below; platform-only categories are explicitly
// marked so they do not widen the other SDKs' existing error types.
enum CodecSdkErrorCategory {
  CODEC_SDK_ERROR_CATEGORY_UNSPECIFIED = 0;
  // sdk: swift
  CODEC_SDK_ERROR_CATEGORY_UNSUPPORTED_PLATFORM = 1;
  // sdk: swift
  CODEC_SDK_ERROR_CATEGORY_DYNAMIC_LIBRARY_NOT_FOUND = 2;
  // sdk: swift
  CODEC_SDK_ERROR_CATEGORY_DYNAMIC_LIBRARY_LOAD_FAILED = 3;
  // sdk: swift
  CODEC_SDK_ERROR_CATEGORY_PROVIDER_UNAVAILABLE = 4;
  // sdk: swift
  CODEC_SDK_ERROR_CATEGORY_SYMBOL_NOT_FOUND = 5;
  // sdk: swift,typescript,kotlin; kotlin-base: true
  CODEC_SDK_ERROR_CATEGORY_INVALID_INPUT = 6;
  // sdk: swift,typescript,kotlin; kotlin-parent: INVALID_INPUT
  CODEC_SDK_ERROR_CATEGORY_UNSUPPORTED_CODEC = 7;
  // sdk: swift,typescript,kotlin; kotlin-parent: INVALID_INPUT
  CODEC_SDK_ERROR_CATEGORY_UNSUPPORTED_IPLD_VALUE = 8;
  // sdk: swift,typescript,kotlin; kotlin-parent: INVALID_INPUT
  CODEC_SDK_ERROR_CATEGORY_NON_CANONICAL = 9;
  // sdk: swift,typescript,kotlin
  CODEC_SDK_ERROR_CATEGORY_PROVIDER_FAILURE = 10;
}

message CodecError {
  oneof error {
    CodecBaseEncodingError base_encoding = 1;
    CodecPemError pem = 2;
    CodecMultiformatError multiformat = 3;
    CodecCanonicalizationError canonicalization = 4;
    CodecBackendError backend = 5;
    CodecBoundaryError boundary = 6;
  }

  // Error origin is explicit so SDKs never infer caller-versus-provider
  // attribution from branch-specific numeric reason ranges. Missing, unknown,
  // or inconsistent origin values must fail closed as provider failures.
  CodecErrorOrigin origin = 100;
}

// CodecPemLabel is the typed protobuf representation of the PEM labels accepted
// by the codec parser.
enum CodecPemLabel {
  CODEC_PEM_LABEL_UNSPECIFIED = 0;
  CODEC_PEM_LABEL_PRIVATE_KEY = 100;
  CODEC_PEM_LABEL_EC_PRIVATE_KEY = 110;
  CODEC_PEM_LABEL_PUBLIC_KEY = 120;
}

message CodecMulticodecPrefixForNameRequest {
  string name = 1;
}

message CodecMulticodecLookupPrefixRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes value = 1;
}

message CodecMulticodecTableRequest {}

message CodecMultikeyParseRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  string multikey = 1;
}

message CodecDagCborVerifyCidRequest {
  string cid = 1;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes payload = 2;
}

// CodecDagCborEncodeRequest is the typed recursive DAG-CBOR encode contract.
// DAG-CBOR map keys are restricted to text keys by
// the adapter even though the reusable recursive value schema can represent
// the wider deterministic-CBOR key domain.
message CodecDagCborEncodeRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  CodecDeterministicCborValue value = 1;
}

message CodecDagCborEncodeResult {
  // Encoded DAG-CBOR bytes may contain the complete sensitive document.
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes encoded = 1;
}

message CodecDagCborDecodeRequest {
  // Encoded DAG-CBOR bytes may contain the complete sensitive document.
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes encoded = 1;
}

message CodecDagCborDecodeResult {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  CodecDeterministicCborValue value = 1;
}

// Zero limits select the documented codec defaults. An empty allowed-label list
// selects PUBLIC KEY only; private-key labels require an explicit allowlist.
message CodecPemDecodeOptions {
  repeated CodecPemLabel allowed_labels = 1;
  uint32 max_input_len = 2;
  uint32 max_der_len = 3;
}

message CodecPemDecodeRequest {
  // PEM may contain private-key material. Bytes avoid long-lived immutable
  // managed strings and let generated hardening wipe the owned request field.
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes pem = 1;
  CodecPemDecodeOptions options = 2;
}

enum CodecPemLineEnding {
  CODEC_PEM_LINE_ENDING_UNSPECIFIED = 0;
  CODEC_PEM_LINE_ENDING_LF = 100;
  CODEC_PEM_LINE_ENDING_CRLF = 110;
}

// Zero values select the documented codec defaults.
message CodecPemEncodeOptions {
  uint32 max_der_len = 1;
  uint32 line_width = 2;
  CodecPemLineEnding line_ending = 3;
}

message CodecPemEncodeRequest {
  CodecPemLabel label = 1;
  // DER may contain private-key material. Generated owned-message drop wipes
  // the retained field; transport decoders may create temporary copies that
  // cannot be reliably wiped. Use binary requests for secret-bearing DER.
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes der = 2;
  CodecPemEncodeOptions options = 3;
}

message CodecPemEncodeResult {
  // PEM armor may contain private-key material and remains byte-oriented so
  // SDK callers can promptly wipe the returned owner.
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes pem = 1;
}

// CodecDeterministicCborNull is the explicit null branch for the deterministic
// generic-CBOR value union.
message CodecDeterministicCborNull {}

message CodecDeterministicCborBool {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bool value = 1;
}

message CodecDeterministicCborUnsignedInteger {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  uint64 value = 1;
}

message CodecDeterministicCborNegativeInteger {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  sint64 value = 1;
}

// CodecDeterministicCborInteger is the exact integer representation supported
// by deterministic generic CBOR. Negative values are restricted to
// i64::MIN..=-1; zero and positive values must use unsigned_value.
message CodecDeterministicCborInteger {
  oneof value {
    CodecDeterministicCborUnsignedInteger unsigned_value = 1;
    CodecDeterministicCborNegativeInteger negative_value = 2;
  }
}

message CodecDeterministicCborText {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  string value = 1;
}

message CodecDeterministicCborBytes {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes value = 1;
}

// CodecDeterministicCborMapKey is the closed map-key domain for deterministic
// generic CBOR. Protobuf map<> is intentionally not used because it cannot
// preserve mixed key types or duplicate entries for semantic rejection.
message CodecDeterministicCborMapKey {
  oneof key {
    CodecDeterministicCborInteger integer_key = 1;
    CodecDeterministicCborText text_key = 2;
  }
}

message CodecDeterministicCborMapEntry {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  CodecDeterministicCborMapKey key = 1;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  CodecDeterministicCborValue value = 2;
}

message CodecDeterministicCborArray {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  repeated CodecDeterministicCborValue values = 1;
}

message CodecDeterministicCborMap {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  repeated CodecDeterministicCborMapEntry entries = 1;
}

// CodecDeterministicCborValue is the generated transport form of the
// deterministic generic-CBOR semantic tree. Text, bytes, and keys are treated
// as sensitive by generated hardening because this is a generic codec surface.
message CodecDeterministicCborValue {
  oneof value {
    CodecDeterministicCborNull null_value = 1;
    CodecDeterministicCborBool bool_value = 2;
    CodecDeterministicCborInteger integer_value = 3;
    CodecDeterministicCborText text_value = 4;
    CodecDeterministicCborBytes bytes_value = 5;
    CodecDeterministicCborArray array_value = 6;
    CodecDeterministicCborMap map_value = 7;
  }
}

message CodecDeterministicCborEncodeRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  CodecDeterministicCborValue value = 1;
}

message CodecDeterministicCborEncodeResult {
  // Encoded CBOR bytes may contain the complete sensitive document.
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes encoded = 1;
}

message CodecDeterministicCborDecodeRequest {
  // Encoded CBOR bytes may contain the complete sensitive document.
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes encoded = 1;
}

message CodecDeterministicCborDecodeResult {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  CodecDeterministicCborValue value = 1;
}

// CodecOperationResult is the fully discriminated generated result contract for
// structured operations.
message CodecOperationResult {
  // Structured result fields use the same permanent family bands as their
  // corresponding requests. Reserve the pre-family range so a future result
  // cannot accidentally introduce a second compact numbering convention.
  reserved 1 to 999;

  oneof result {
    CodecMulticodecSpec multicodec_prefix_for_name = 1000;
    CodecMulticodecLookupResult multicodec_lookup_prefix = 1001;
    CodecMulticodecTableResult multicodec_table = 1002;
    CodecMultikeyParseResult multikey_parse = 2000;
    CodecDagCborVerifyCidResult dag_cbor_verify_cid = 3000;
    CodecDagCborEncodeResult dag_cbor_encode = 3001;
    CodecDagCborDecodeResult dag_cbor_decode = 3002;
    CodecPemDecodeResult pem_decode = 4000;
    CodecPemEncodeResult pem_encode = 4001;
    CodecDeterministicCborEncodeResult deterministic_cbor_encode = 5000;
    CodecDeterministicCborDecodeResult deterministic_cbor_decode = 5001;

    // Schema-defined scalar, borrowed-parser, and provider metadata operations.
  }
}

// CodecOperationResponse removes invalid status/payload combinations for new
// structured callers by making success and failure explicit generated variants.
message CodecOperationResponse {
  oneof outcome {
    CodecOperationResult result = 1;
    CodecError error = 2;
  }
}

// CodecOperationRequest is the single executable protobuf request. Native SDK
// callers continue to use typed methods; binary protobuf and generated
// ProtoJSON adapters select exactly one operation through this oneof. Sparse
// field bands keep related codec families together without creating a second
// out-of-band operation namespace.
message CodecOperationRequest {
  reserved 1 to 999;

  oneof operation {
    // 1000-1999: multicodec table and prefix lookups. The upstream registry
    // is intentionally broad, so keep ample room for validation and lookup
    // operations without mixing them with adjacent codec families.
    CodecMulticodecPrefixForNameRequest multicodec_prefix_for_name = 1000;
    CodecMulticodecLookupPrefixRequest multicodec_lookup_prefix = 1001;
    CodecMulticodecTableRequest multicodec_table = 1002;

    // 2000-2999: multikey parsing and validation.
    CodecMultikeyParseRequest multikey_parse = 2000;

    // 3000-3999: DAG-CBOR and content-addressed canonicalization helpers.
    CodecDagCborVerifyCidRequest dag_cbor_verify_cid = 3000;
    CodecDagCborEncodeRequest dag_cbor_encode = 3001;
    CodecDagCborDecodeRequest dag_cbor_decode = 3002;

    // 4000-4999: PEM armor and DER envelope helpers.
    CodecPemDecodeRequest pem_decode = 4000;
    CodecPemEncodeRequest pem_encode = 4001;

    // 5000-5999: deterministic generic-CBOR encode/decode.
    CodecDeterministicCborEncodeRequest deterministic_cbor_encode = 5000;
    CodecDeterministicCborDecodeRequest deterministic_cbor_decode = 5001;

    // Schema-defined scalar, borrowed-parser, and provider metadata operations.
  }
}

// CodecKeyMaterialKind classifies the material described by a multicodec
// table entry. The enum is intentionally small and owned by this package so
// SDKs do not pass ad hoc strings across FFI or RPC boundaries.
enum CodecKeyMaterialKind {
  CODEC_KEY_MATERIAL_KIND_UNSPECIFIED = 0;
  // sdk-order: 1
  CODEC_KEY_MATERIAL_KIND_PUBLIC_KEY = 1;
  // sdk-order: 2
  CODEC_KEY_MATERIAL_KIND_PRIVATE_KEY = 2;
  // sdk-order: 3
  CODEC_KEY_MATERIAL_KIND_SYMMETRIC_KEY = 3;
  // sdk-order: 0
  CODEC_KEY_MATERIAL_KIND_NOT_KEY = 4;
}

// CodecTag classifies the protocol role of a multicodec table entry.
enum CodecTag {
  CODEC_TAG_UNSPECIFIED = 0;
  // sdk-order: 0
  CODEC_TAG_ENCRYPTION = 1;
  // sdk-order: 2
  CODEC_TAG_KEY = 2;
  // sdk-order: 1
  CODEC_TAG_HASH = 3;
  // sdk-order: 3
  CODEC_TAG_MULTIHASH = 4;
  // sdk-order: 4
  CODEC_TAG_MULTIKEY = 5;
}

// CodecMulticodecSpec is the protobuf form of a multicodec table entry.
message CodecMulticodecSpec {
  string name = 1;
  // Raw multicodec varint bytes for callers that need the numeric code
  // encoding independent of any payload.
  bytes code = 2;
  // Prefix bytes to match or prepend on encoded values. For currently
  // supported codecs this is identical to code, but it is kept separate so
  // consumers can use semantic field names without deriving one from the
  // other.
  bytes prefix = 3;
  CodecTag tag = 4;
  CodecKeyMaterialKind key_material_kind = 5;
  // Legacy length rule: nonzero/false is fixed, zero/true is variable, and
  // zero/false is not applicable. Nonzero/true is invalid provider metadata.
  uint32 fixed_length = 6;
  bool variable_length = 7;
  string algorithm_name = 8;
}

// CodecMulticodecLookupResult is returned when bytes are matched against the
// supported multicodec prefix table.
message CodecMulticodecLookupResult {
  string name = 1;
  uint32 prefix_length = 2;
  CodecMulticodecSpec metadata = 3;
}

// CodecMulticodecTableResult contains the supported multicodec entries.
message CodecMulticodecTableResult {
  repeated CodecMulticodecSpec entries = 1;
}

// CodecMultikeyParseResult is the binary/protobuf form of multikey parsing.
message CodecMultikeyParseResult {
  string codec_name = 1;
  string algorithm_name = 2;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes public_key = 3;
  // Legacy length rule: nonzero/false is fixed and must match public_key's
  // byte length; zero/true is variable. The other combinations are invalid.
  uint32 expected_public_key_length = 4;
  bool variable_public_key_length = 5;
}

// CodecDagCborVerifyCidResult contains the deterministic CID verification
// result without requiring callers to parse fixed-shape JSON.
message CodecDagCborVerifyCidResult {
  bool valid = 1;
  string expected_cid = 2;
  string actual_cid = 3;
}

// CodecPemDecodeResult is the binary/protobuf form of PEM armor decoding.
message CodecPemDecodeResult {
  string label = 1;
  // DER may contain private-key material. Receivers that request protobuf PEM
  // decode results are responsible for copying it into their language's
  // sensitive-buffer owner and wiping intermediate protobuf containers as soon
  // as practical.
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes der = 2;
}

// CodecBaseEncodingError describes base64, base64url, hex, and generic byte
// encoding failures.
message CodecBaseEncodingError {
  // Reason must be one of the CODEC_ERROR_REASON_BASE_* values.
  CodecErrorReason reason = 1;
}

// CodecPemError describes RFC 7468-style PEM armor boundary and body failures.
message CodecPemError {
  // Reason must be one of the CODEC_ERROR_REASON_PEM_* values.
  CodecErrorReason reason = 1;
}

// CodecMultiformatError describes multibase, multicodec, and multikey
// envelope failures.
message CodecMultiformatError {
  // Reason must be one of the CODEC_ERROR_REASON_MULTIFORMAT_* values.
  CodecErrorReason reason = 1;
}

// CodecCanonicalizationError describes CBOR, DAG-CBOR, JCS, and JSON
// canonicalization failures.
message CodecCanonicalizationError {
  // Reason must be one of the CODEC_ERROR_REASON_CANONICAL_* values.
  CodecErrorReason reason = 1;
}

// CodecBackendError describes serialization, protobuf, dispatch, FFI, WASM,
// and internal failures that are not safe to expose as backend exception text.
message CodecBackendError {
  // Reason must be one of the CODEC_ERROR_REASON_BACKEND_* values.
  CodecErrorReason reason = 1;
}

// CodecBoundaryError describes malformed, oversized, or incomplete caller
// requests. These failures are not backend failures and never contain parser
// or runtime exception text.
message CodecBoundaryError {
  // Reason must be one of the CODEC_ERROR_REASON_BOUNDARY_* values.
  CodecErrorReason reason = 1;
}

// CodecErrorReason is the component-owned reason-code enum for reallyme/codec.
// Values are stable public boundary codes; local parser errors must map into
// one of these before crossing RPC, SDK, FFI, storage, audit, or telemetry
// boundaries. Numeric ranges are intentionally split by codec subpart:
//   100-199: base encodings
//   200-299: PEM armor
//   300-399: multiformats and key envelopes
//   400-499: CBOR/JCS/JSON canonicalization
//   500-599: backend and internal failures
//   600-699: caller-controlled protobuf and ProtoJSON boundary failures
enum CodecErrorReason {
  reserved 112;

  CODEC_ERROR_REASON_UNSPECIFIED = 0;

  // Base encodings and generic byte-envelope limits.
  CODEC_ERROR_REASON_BASE_UNSUPPORTED_CODEC = 100;
  CODEC_ERROR_REASON_BASE_INVALID_ENCODING = 101;
  CODEC_ERROR_REASON_BASE_INVALID_LENGTH = 102;
  CODEC_ERROR_REASON_BASE_INPUT_TOO_LARGE = 103;
  CODEC_ERROR_REASON_BASE_OUTPUT_TOO_LARGE = 104;
  CODEC_ERROR_REASON_BASE_INVALID_BASE64 = 110;
  CODEC_ERROR_REASON_BASE_INVALID_BASE64URL = 111;
  CODEC_ERROR_REASON_BASE_INVALID_HEX = 120;
  CODEC_ERROR_REASON_BASE_NON_CANONICAL_HEX = 121;

  // PEM armor.
  CODEC_ERROR_REASON_PEM_INVALID_BOUNDARY = 200;
  CODEC_ERROR_REASON_PEM_LABEL_MISMATCH = 201;
  CODEC_ERROR_REASON_PEM_UNSUPPORTED_LABEL = 202;
  CODEC_ERROR_REASON_PEM_INVALID_BODY = 203;
  CODEC_ERROR_REASON_PEM_DER_TOO_LARGE = 204;
  CODEC_ERROR_REASON_PEM_EMPTY_INPUT = 205;
  CODEC_ERROR_REASON_PEM_EMPTY_DER = 206;
  CODEC_ERROR_REASON_PEM_INVALID_OPTIONS = 207;
  CODEC_ERROR_REASON_PEM_MISSING_BEGIN = 208;
  CODEC_ERROR_REASON_PEM_MISSING_END = 209;
  CODEC_ERROR_REASON_PEM_INVALID_BASE64 = 210;

  // Multiformats and key envelopes.
  CODEC_ERROR_REASON_MULTIFORMAT_INVALID_MULTIBASE_PREFIX = 300;
  CODEC_ERROR_REASON_MULTIFORMAT_INVALID_MULTICODEC_PREFIX = 301;
  CODEC_ERROR_REASON_MULTIFORMAT_UNKNOWN_MULTICODEC = 302;
  CODEC_ERROR_REASON_MULTIFORMAT_INVALID_MULTIKEY = 303;

  // CBOR, DAG-CBOR, JCS, and JSON canonicalization.
  CODEC_ERROR_REASON_CANONICAL_INVALID_CBOR = 400;
  CODEC_ERROR_REASON_CANONICAL_NON_CANONICAL_CBOR = 401;
  CODEC_ERROR_REASON_CANONICAL_INVALID_JSON = 402;
  CODEC_ERROR_REASON_CANONICAL_NON_CANONICAL_JSON = 403;
  CODEC_ERROR_REASON_CANONICAL_INTERNAL = 404;
  CODEC_ERROR_REASON_CANONICAL_NON_MINIMAL_CBOR_INTEGER = 405;
  CODEC_ERROR_REASON_CANONICAL_DUPLICATE_CBOR_MAP_KEY = 406;
  CODEC_ERROR_REASON_CANONICAL_CBOR_MAP_KEYS_OUT_OF_ORDER = 407;
  CODEC_ERROR_REASON_CANONICAL_CBOR_TRAILING_BYTES = 408;
  CODEC_ERROR_REASON_CANONICAL_UNSUPPORTED_IPLD_VALUE = 409;
  CODEC_ERROR_REASON_CANONICAL_INVALID_DER = 410;
  CODEC_ERROR_REASON_CANONICAL_INVALID_TLV = 411;

  // Backend failures.
  CODEC_ERROR_REASON_BACKEND_INTERNAL = 500;

  // Caller-controlled wire-boundary failures.
  CODEC_ERROR_REASON_BOUNDARY_MALFORMED_PROTOBUF = 600;
  CODEC_ERROR_REASON_BOUNDARY_MALFORMED_JSON = 601;
  CODEC_ERROR_REASON_BOUNDARY_RESOURCE_LIMIT_EXCEEDED = 602;
  CODEC_ERROR_REASON_BOUNDARY_MISSING_OPERATION = 603;
}

// Every executable codec operation is declared here. Native borrowed APIs
// are compatibility facades over these contracts and preserve caller ownership.
// Existing field numbers and existing operation encodings are permanent.

message CodecBytesRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes value = 1;
}

message CodecTextRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  string value = 1;
}

message CodecEmptyRequest {
}

message CodecBytesResult {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes value = 1;
}

message CodecTextResult {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  string value = 1;
}

message CodecBoolResult {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bool value = 1;
}

message CodecUint32Result {
  // SENSITIVE: observations retain caller-controlled scalar payloads.
  uint32 value = 1;
}

message CodecEmptyResult {
}

message CodecOptionalTextResult {
  CodecTextResult value = 1;
}

message CodecMultikeyEncodeRequest {
  string codec_name = 1;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes public_key = 2;
}

message CodecBindingTypeMatchesCodecRequest {
  string binding_type = 1;
  string codec_name = 2;
}

message CodecValidateKeyBindingRequest {
  string binding_type = 1;
  optional string algorithm = 2;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  string multikey = 3;
}

enum CodecGeneralCborLengthPolicy {
  CODEC_GENERAL_CBOR_LENGTH_POLICY_UNSPECIFIED = 0;
  CODEC_GENERAL_CBOR_LENGTH_POLICY_DEFINITE_ONLY = 1;
  CODEC_GENERAL_CBOR_LENGTH_POLICY_ALLOW_INDEFINITE = 2;
}

enum CodecGeneralCborSerialization {
  CODEC_GENERAL_CBOR_SERIALIZATION_UNSPECIFIED = 0;
  CODEC_GENERAL_CBOR_SERIALIZATION_RECEIVED = 1;
  CODEC_GENERAL_CBOR_SERIALIZATION_PREFERRED = 2;
}

enum CodecGeneralCborFloatPolicy {
  CODEC_GENERAL_CBOR_FLOAT_POLICY_UNSPECIFIED = 0;
  CODEC_GENERAL_CBOR_FLOAT_POLICY_ALL = 1;
  CODEC_GENERAL_CBOR_FLOAT_POLICY_FINITE_ONLY = 2;
  CODEC_GENERAL_CBOR_FLOAT_POLICY_REJECT = 3;
}

enum CodecGeneralCborMapOrdering {
  CODEC_GENERAL_CBOR_MAP_ORDERING_UNSPECIFIED = 0;
  CODEC_GENERAL_CBOR_MAP_ORDERING_RECEIVED = 1;
  CODEC_GENERAL_CBOR_MAP_ORDERING_LENGTH_FIRST = 2;
  CODEC_GENERAL_CBOR_MAP_ORDERING_BYTEWISE = 3;
}

enum CodecGeneralCborFloatWidth {
  CODEC_GENERAL_CBOR_FLOAT_WIDTH_UNSPECIFIED = 0;
  CODEC_GENERAL_CBOR_FLOAT_WIDTH_BINARY16 = 1;
  CODEC_GENERAL_CBOR_FLOAT_WIDTH_BINARY32 = 2;
  CODEC_GENERAL_CBOR_FLOAT_WIDTH_BINARY64 = 3;
}

enum CodecGeneralCborMajorType {
  CODEC_GENERAL_CBOR_MAJOR_TYPE_UNSPECIFIED = 0;
  CODEC_GENERAL_CBOR_MAJOR_TYPE_UNSIGNED = 1;
  CODEC_GENERAL_CBOR_MAJOR_TYPE_NEGATIVE = 2;
  CODEC_GENERAL_CBOR_MAJOR_TYPE_BYTES = 3;
  CODEC_GENERAL_CBOR_MAJOR_TYPE_TEXT = 4;
  CODEC_GENERAL_CBOR_MAJOR_TYPE_ARRAY = 5;
  CODEC_GENERAL_CBOR_MAJOR_TYPE_MAP = 6;
  CODEC_GENERAL_CBOR_MAJOR_TYPE_TAG = 7;
  CODEC_GENERAL_CBOR_MAJOR_TYPE_SIMPLE = 8;
}

enum CodecGeneralCborArgumentWidth {
  CODEC_GENERAL_CBOR_ARGUMENT_WIDTH_UNSPECIFIED = 0;
  CODEC_GENERAL_CBOR_ARGUMENT_WIDTH_INLINE = 1;
  CODEC_GENERAL_CBOR_ARGUMENT_WIDTH_ONE = 2;
  CODEC_GENERAL_CBOR_ARGUMENT_WIDTH_TWO = 3;
  CODEC_GENERAL_CBOR_ARGUMENT_WIDTH_FOUR = 4;
  CODEC_GENERAL_CBOR_ARGUMENT_WIDTH_EIGHT = 5;
  CODEC_GENERAL_CBOR_ARGUMENT_WIDTH_INDEFINITE = 6;
  CODEC_GENERAL_CBOR_ARGUMENT_WIDTH_BREAK = 7;
}

enum CodecGeneralCborInspection {
  CODEC_GENERAL_CBOR_INSPECTION_UNSPECIFIED = 0;
  CODEC_GENERAL_CBOR_INSPECTION_RECEIVED_BYTES = 1;
  CODEC_GENERAL_CBOR_INSPECTION_BODY_BYTES = 2;
  CODEC_GENERAL_CBOR_INSPECTION_INTEGER = 3;
  CODEC_GENERAL_CBOR_INSPECTION_FLOAT = 4;
  CODEC_GENERAL_CBOR_INSPECTION_SIMPLE_VALUE = 5;
  CODEC_GENERAL_CBOR_INSPECTION_BOOL = 6;
  CODEC_GENERAL_CBOR_INSPECTION_BYTES = 7;
  CODEC_GENERAL_CBOR_INSPECTION_TEXT = 8;
  CODEC_GENERAL_CBOR_INSPECTION_STRING_CHUNKS = 9;
  CODEC_GENERAL_CBOR_INSPECTION_CHILDREN = 10;
  CODEC_GENERAL_CBOR_INSPECTION_TAGGED_BYTES = 11;
}

// Omitted limit fields select defaults; explicit zero retains its native limit semantics.
// Present options require all four policy enums; omitting options selects received defaults.
// Wire receipt collections are bounded by twice entries to include map key/value pairs.
message CodecGeneralCborOptions {
  CodecGeneralCborSerialization serialization = 1;
  CodecGeneralCborLengthPolicy lengths = 2;
  CodecGeneralCborFloatPolicy floats = 3;
  CodecGeneralCborMapOrdering ordering = 4;
  optional uint64 input_bytes = 5;
  optional uint64 output_bytes = 6;
  optional uint64 depth = 7;
  optional uint64 nodes = 8;
  optional uint64 entries = 9;
  optional uint64 byte_string_bytes = 10;
  optional uint64 text_bytes = 11;
  optional uint64 work = 12;
}

// A checked half-open span in the request source; bytes are never reconstructed.
message CodecByteSpan {
  uint64 offset = 1;
  uint64 length = 2;
}

// IEEE bits are transported as integers so NaN payloads and signed zero survive exactly.
message CodecGeneralCborFloat {
  CodecGeneralCborFloatWidth width = 1;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  uint64 bits = 2;
}

// Negative integers represent -1-argument, including values below i64::MIN.
message CodecGeneralCborInteger {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bool negative = 1;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  uint64 argument = 2;
}

message CodecGeneralCborHeader {
  CodecGeneralCborMajorType major_type = 1;
  CodecGeneralCborArgumentWidth width = 2;
  // SENSITIVE: observations retain caller-controlled scalar payloads.
  optional uint64 argument = 3;
  uint64 encoded_length = 4;
  optional bool preferred_argument = 5;
  optional bool preferred_float = 6;
  CodecGeneralCborFloat float_value = 7;
}

// All spans refer to the original request input, retaining received headers and map order.
message CodecGeneralCborFrame {
  CodecByteSpan received = 1;
  CodecByteSpan header_bytes = 2;
  CodecByteSpan body = 3;
  CodecGeneralCborHeader header = 4;
  bool validated = 5;
  CodecGeneralCborOptions options = 6;
}

message CodecGeneralCborFrames {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  repeated CodecGeneralCborFrame values = 1;
  uint64 consumed_bytes = 2;
}

message CodecGeneralCborChunks {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  repeated CodecByteSpan values = 1;
}

message CodecGeneralCborTaggedBytes {
  // SENSITIVE: observations retain caller-controlled scalar payloads.
  uint64 tag = 1;
  CodecByteSpan received = 2;
  CodecByteSpan payload = 3;
}

message CodecGeneralCborSourceRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes encoded = 1;
  CodecGeneralCborOptions options = 2;
}

message CodecGeneralCborInspectRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes encoded = 1;
  CodecGeneralCborOptions options = 2;
  CodecGeneralCborInspection inspection = 3;
  bool validate = 4;
}

// Outer options bound framing; embedded options validate the exact tag-24 payload.
message CodecGeneralCborEmbeddedRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes encoded = 1;
  CodecGeneralCborOptions outer_options = 2;
  CodecGeneralCborOptions embedded_options = 3;
}

message CodecGeneralCborInspectionResult {
  oneof value {
    CodecBytesResult bytes_value = 1;
    CodecTextResult text_value = 2;
    CodecGeneralCborInteger integer_value = 3;
    CodecGeneralCborFloat float_value = 4;
    CodecUint32Result simple_value = 5;
    CodecBoolResult bool_value = 6;
    CodecGeneralCborChunks chunks = 7;
    CodecGeneralCborFrames children = 8;
    CodecGeneralCborTaggedBytes tagged_bytes = 9;
  }
}

message CodecGeneralCborUnsigned {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  uint64 argument = 1;
}

message CodecGeneralCborNegative {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  uint64 argument = 1;
}

message CodecGeneralCborSimple {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  uint32 value = 1;
