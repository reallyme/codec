enum CodecDerType {
  CODEC_DER_TYPE_UNSPECIFIED = 0;
  CODEC_DER_TYPE_UNSIGNED_INTEGER = 1;
  CODEC_DER_TYPE_INTEGER = 2;
  CODEC_DER_TYPE_BOOLEAN = 3;
  CODEC_DER_TYPE_OCTET_STRING = 4;
  CODEC_DER_TYPE_BIT_STRING = 5;
  CODEC_DER_TYPE_NULL = 6;
  CODEC_DER_TYPE_OBJECT_IDENTIFIER = 7;
  CODEC_DER_TYPE_UTF8_STRING = 8;
  CODEC_DER_TYPE_SEQUENCE = 9;
  CODEC_DER_TYPE_SET_OF = 10;
}

message CodecDerLimits {
  optional uint64 input_len = 1;
  optional uint64 nesting_depth = 2;
  optional uint64 elements = 3;
  optional uint64 integer_len = 4;
}

// SEQUENCE children are ordered required fields; SET OF requires exactly one element schema.
message CodecDerSchema {
  CodecDerType kind = 1;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  repeated CodecDerSchema children = 2;
}

message CodecDerDecodeRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
