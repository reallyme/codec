  CODEC_LEGACY_ABI_STATUS_UNSPECIFIED = 0;
  CODEC_LEGACY_ABI_STATUS_INVALID_ARGUMENT = -1;
  CODEC_LEGACY_ABI_STATUS_BUFFER_TOO_SMALL = -5;
  CODEC_LEGACY_ABI_STATUS_INTERNAL_ERROR = -128;
}

// Expanded operation envelope. Existing CodecOperation* messages retain their
// original branches and field numbers, preserving their wire bytes.
message CodecApiOperationRequest {
  reserved 1 to 999;

  oneof operation {
    // 1000-1999: multicodec table and prefix lookups. The upstream registry
    // is intentionally broad, so keep ample room for validation and lookup
    // operations without mixing them with adjacent codec families.
    CodecMulticodecPrefixForNameRequest multicodec_prefix_for_name = 1000;
    CodecMulticodecLookupPrefixRequest multicodec_lookup_prefix = 1001;
    CodecMulticodecTableRequest multicodec_table = 1002;

    // 2000-2999: multikey parsing and validation.
    CodecMultikeyParseRequest multikey_parse = 2000;

    // 3000-3999: DAG-CBOR and content-addressed canonicalization helpers.
    CodecDagCborVerifyCidRequest dag_cbor_verify_cid = 3000;
    CodecDagCborEncodeRequest dag_cbor_encode = 3001;
    CodecDagCborDecodeRequest dag_cbor_decode = 3002;

    // 4000-4999: PEM armor and DER envelope helpers.
    CodecPemDecodeRequest pem_decode = 4000;
    CodecPemEncodeRequest pem_encode = 4001;

    // 5000-5999: deterministic generic-CBOR encode/decode.
    CodecDeterministicCborEncodeRequest deterministic_cbor_encode = 5000;
    CodecDeterministicCborDecodeRequest deterministic_cbor_decode = 5001;

    // Schema-defined scalar, borrowed-parser, and provider metadata operations.
    CodecBytesRequest multicodec_strip_prefix = 1003;
    CodecMultikeyEncodeRequest multikey_encode = 2001;
    CodecBindingTypeMatchesCodecRequest binding_type_matches_codec = 2002;
    CodecValidateKeyBindingRequest validate_key_binding = 2003;
    CodecTextRequest require_supported_multicodec = 2004;
    CodecBytesRequest dag_cbor_compute_cid = 3003;
    CodecBytesRequest dag_cbor_multihash = 3004;
    CodecBytesRequest dag_cbor_sha256_content_hash = 3005;
    CodecTextRequest is_valid_cid_string = 3006;
    CodecTextRequest try_parse_cid = 3007;
    CodecEmptyRequest dag_cbor_codec_code = 3008;
    CodecGeneralCborSourceRequest general_cbor_read_header = 6000;
    CodecGeneralCborSourceRequest general_cbor_frame_exact = 6001;
    CodecGeneralCborSourceRequest general_cbor_frame_prefix = 6002;
    CodecGeneralCborSourceRequest general_cbor_validate_exact = 6003;
    CodecGeneralCborSourceRequest general_cbor_validate_prefix = 6004;
    CodecGeneralCborEncodeRequest general_cbor_encode = 6005;
    CodecGeneralCborInspectRequest general_cbor_inspect = 6006;
    CodecGeneralCborSourceRequest general_cbor_cursor = 6007;
    CodecGeneralCborEmbeddedRequest general_cbor_validate_embedded = 6008;
    CodecDerDecodeRequest der_decode = 7000;
    CodecDerPairRequest der_decode_unsigned_integer_pair = 7001;
    CodecDerReadRequest der_read = 7002;
    CodecBytesRequest base64_encode = 8000;
    CodecTextRequest base64_decode = 8001;
    CodecBytesRequest base64url_encode = 8010;
    CodecTextRequest base64url_decode = 8011;
    CodecBytesRequest base64url_decode_bytes = 8012;
    CodecBytesRequest lower_hex_encode = 8020;
    CodecTextRequest lower_hex_decode = 8021;
    CodecBytesRequest base58btc_encode = 8030;
    CodecTextRequest base58btc_decode = 8031;
    CodecBytesRequest multibase_base58btc_encode = 8040;
    CodecBytesRequest multibase_base64url_encode = 8041;
    CodecTextRequest multibase_decode = 8042;
    CodecTextRequest canonicalize_json = 9000;
    CodecProviderInfoRequest provider_info = 10000;
    CodecGeneralCborFloatPropertiesRequest general_cbor_float_properties = 6009;
    CodecGeneralCborFloatCompareRequest general_cbor_float_equivalent = 6010;
    // 11000-11999: bounded definite BER/ISO 7816 and DER header framing.
    CodecTlvSourceRequest tlv_read_header = 11000;
    CodecTlvSourceRequest tlv_frame_prefix = 11001;
    CodecTlvSourceRequest tlv_frame_exact = 11002;
    CodecTlvSourceRequest tlv_read_identifier = 11003;
    CodecTlvSourceRequest tlv_read_length = 11004;
  }
}

message CodecApiOperationResult {
  // Structured result fields use the same permanent family bands as their
  // corresponding requests. Reserve the pre-family range so a future result
  // cannot accidentally introduce a second compact numbering convention.
  reserved 1 to 999;

  oneof result {
    CodecMulticodecSpec multicodec_prefix_for_name = 1000;
    CodecMulticodecLookupResult multicodec_lookup_prefix = 1001;
    CodecMulticodecTableResult multicodec_table = 1002;
    CodecMultikeyParseResult multikey_parse = 2000;
    CodecDagCborVerifyCidResult dag_cbor_verify_cid = 3000;
    CodecDagCborEncodeResult dag_cbor_encode = 3001;
    CodecDagCborDecodeResult dag_cbor_decode = 3002;
    CodecPemDecodeResult pem_decode = 4000;
    CodecPemEncodeResult pem_encode = 4001;
    CodecDeterministicCborEncodeResult deterministic_cbor_encode = 5000;
    CodecDeterministicCborDecodeResult deterministic_cbor_decode = 5001;

    // Schema-defined scalar, borrowed-parser, and provider metadata operations.
    CodecBytesResult multicodec_strip_prefix = 1003;
    CodecTextResult multikey_encode = 2001;
    CodecBoolResult binding_type_matches_codec = 2002;
    CodecEmptyResult validate_key_binding = 2003;
    CodecTextResult require_supported_multicodec = 2004;
    CodecTextResult dag_cbor_compute_cid = 3003;
    CodecBytesResult dag_cbor_multihash = 3004;
    CodecBytesResult dag_cbor_sha256_content_hash = 3005;
    CodecBoolResult is_valid_cid_string = 3006;
    CodecOptionalTextResult try_parse_cid = 3007;
    CodecUint32Result dag_cbor_codec_code = 3008;
    CodecGeneralCborHeader general_cbor_read_header = 6000;
    CodecGeneralCborFrame general_cbor_frame_exact = 6001;
    CodecGeneralCborFrame general_cbor_frame_prefix = 6002;
    CodecGeneralCborFrame general_cbor_validate_exact = 6003;
    CodecGeneralCborFrame general_cbor_validate_prefix = 6004;
    CodecBytesResult general_cbor_encode = 6005;
    CodecGeneralCborInspectionResult general_cbor_inspect = 6006;
    CodecGeneralCborFrames general_cbor_cursor = 6007;
    CodecGeneralCborFrame general_cbor_validate_embedded = 6008;
    CodecDerValue der_decode = 7000;
    CodecDerUnsignedIntegerPair der_decode_unsigned_integer_pair = 7001;
    CodecDerReadResult der_read = 7002;
    CodecTextResult base64_encode = 8000;
    CodecBytesResult base64_decode = 8001;
    CodecTextResult base64url_encode = 8010;
    CodecBytesResult base64url_decode = 8011;
    CodecBytesResult base64url_decode_bytes = 8012;
    CodecTextResult lower_hex_encode = 8020;
    CodecBytesResult lower_hex_decode = 8021;
    CodecTextResult base58btc_encode = 8030;
    CodecBytesResult base58btc_decode = 8031;
    CodecTextResult multibase_base58btc_encode = 8040;
    CodecTextResult multibase_base64url_encode = 8041;
    CodecBytesResult multibase_decode = 8042;
    CodecTextResult canonicalize_json = 9000;
    CodecProviderInfo provider_info = 10000;
    CodecGeneralCborFloatProperties general_cbor_float_properties = 6009;
    CodecBoolResult general_cbor_float_equivalent = 6010;
    CodecTlvHeader tlv_read_header = 11000;
    CodecTlvFrame tlv_frame_prefix = 11001;
    CodecTlvFrame tlv_frame_exact = 11002;
    CodecTlvIdentifier tlv_read_identifier = 11003;
