// Flat, definite-length framing. Neither profile decodes ASN.1 value semantics
// or recursively validates constructed contents. The strict DER schema reader
// remains the operation for complete DER validation.
enum CodecTlvProfile {
  CODEC_TLV_PROFILE_UNSPECIFIED = 0;
  // Preserve every identifier octet and allow redundant definite length octets.
  // End-of-contents and a zero initial high-tag group are not definite values.
  CODEC_TLV_PROFILE_ISO7816_DEFINITE_BER = 1;
  // Require a canonical outer identifier and minimal definite outer length.
  CODEC_TLV_PROFILE_ASN1_DER_FRAMING = 2;
}

// Omitted fields select defaults; explicit zero is invalid. Limits can only
// select values up to the hard ceilings: input 16 MiB, identifier 32 octets,
// length 8 octets. The input limit includes any unconsumed suffix.
// Defaults are 1 MiB, 4 identifier octets, and 4 long-form length payload octets.
// length_octets excludes the initial short/long-form discriminator octet.
message CodecTlvLimits {
  optional uint64 input_bytes = 1;
  optional uint64 identifier_octets = 2;
  optional uint64 length_octets = 3;
}

// An explicit known nonzero profile is required, even when limits are omitted.
message CodecTlvOptions {
  CodecTlvProfile profile = 1;
  CodecTlvLimits limits = 2;
}

message CodecTlvSourceRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bytes encoded = 1;
  CodecTlvOptions options = 2;
}

// A complete wire identifier prefix. No length field is read.
message CodecTlvIdentifier {
  CodecByteSpan identifier = 1;
  uint64 consumed_bytes = 2;
}

// A complete definite length prefix. No value bytes are required.
message CodecTlvLength {
  CodecByteSpan length_octets = 1;
  // SENSITIVE: observations retain caller-controlled scalar payloads.
  uint64 declared_value_length = 2;
  uint64 consumed_bytes = 3;
}

// Every span fits the supplied source. This receipt makes no claim that the
// declared value has arrived: only a complete identifier and length are needed.
// The supplied remainder begins at consumed_bytes and remains bounded by input.
message CodecTlvHeader {
  CodecByteSpan identifier = 1;
  CodecByteSpan length_octets = 2;
  CodecByteSpan header_bytes = 3;
  // SENSITIVE: observations retain caller-controlled scalar payloads.
  uint64 declared_value_length = 4;
  uint64 consumed_bytes = 5;
}

// Only complete values have frame receipts. Contents remain opaque, including
// constructed values. Prefix leaves source[consumed_bytes..] unconsumed; exact
// rejects that suffix unless it is empty. No payload allocation is performed.
message CodecTlvFrame {
  CodecTlvHeader header = 1;
  CodecByteSpan received = 2;
  CodecByteSpan contents = 3;
  uint64 consumed_bytes = 4;
}

enum CodecTlvErrorReason {
  CODEC_TLV_ERROR_REASON_UNSPECIFIED = 0;
  // Error text: empty input
  CODEC_TLV_ERROR_REASON_EMPTY_INPUT = 1;
  // Error text: unsupported framing profile
  CODEC_TLV_ERROR_REASON_INVALID_PROFILE = 2;
  // Error text: invalid resource limits
  CODEC_TLV_ERROR_REASON_INVALID_LIMITS = 3;
  // Error text: input limit exceeded
  CODEC_TLV_ERROR_REASON_INPUT_LIMIT = 4;
  // Error text: identifier octet limit exceeded
  CODEC_TLV_ERROR_REASON_IDENTIFIER_LIMIT = 5;
  // Error text: length octet limit exceeded
  CODEC_TLV_ERROR_REASON_LENGTH_LIMIT = 6;
  // Error text: truncated identifier
  CODEC_TLV_ERROR_REASON_TRUNCATED_IDENTIFIER = 7;
  // Error text: truncated length
  CODEC_TLV_ERROR_REASON_TRUNCATED_LENGTH = 8;
  // Error text: truncated value
  CODEC_TLV_ERROR_REASON_TRUNCATED_VALUE = 9;
  // Error text: indefinite length is not supported
  CODEC_TLV_ERROR_REASON_UNSUPPORTED_INDEFINITE_LENGTH = 10;
  // Error text: noncanonical identifier
  CODEC_TLV_ERROR_REASON_NONCANONICAL_IDENTIFIER = 11;
  // Error text: noncanonical length
  CODEC_TLV_ERROR_REASON_NONCANONICAL_LENGTH = 12;
  // Error text: trailing data
  CODEC_TLV_ERROR_REASON_TRAILING_DATA = 13;
  // Error text: length arithmetic overflow
  CODEC_TLV_ERROR_REASON_ARITHMETIC_OVERFLOW = 14;
  // Error text: reserved length encoding
  CODEC_TLV_ERROR_REASON_INVALID_LENGTH = 15;
  // Error text: invalid definite-value identifier
  CODEC_TLV_ERROR_REASON_INVALID_IDENTIFIER = 16;
}

message CodecTlvError {
  CodecErrorReason reason = 1;
  CodecTlvErrorReason detail = 2;
}

message CodecProviderInfoRequest {
}

message CodecProviderInfo {
  uint32 abi_version = 1;
  uint32 package_major = 2;
  uint32 package_minor = 3;
  uint32 package_patch = 4;
  uint64 max_input_bytes = 5;
  uint64 max_output_bytes = 6;
  uint64 max_operation_response_bytes = 7;
}

// Host provider operation: verify before loading; paths never appear in errors.
message CodecVerifiedLibraryRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  string absolute_path = 1;
  bytes expected_sha256 = 2;
}

message CodecVerifiedLibraryResult {
  CodecProviderInfo provider = 1;
}

// Provider lifecycle belongs to the host adapter, never the pure codec core.
message CodecProviderOperationRequest {
  oneof operation {
    CodecProviderInfoRequest info = 1;
    CodecVerifiedLibraryRequest verify_library = 2;
    CodecLibraryLoadRequest load_library = 3;
    CodecWasmInitializeRequest initialize_wasm = 4;
    CodecWasmReinstantiateRequest reinstantiate_wasm = 5;
  }
}

message CodecProviderOperationResult {
  oneof result {
    CodecProviderInfo info = 1;
    CodecVerifiedLibraryResult verified_library = 2;
    CodecLoadedLibraryResult loaded_library = 3;
    CodecProviderInfo initialized_wasm = 4;
    CodecEmptyResult reinstantiated_wasm = 5;
  }
}


message CodecGeneralCborFloatPropertiesRequest {
  CodecGeneralCborFloat value = 1;
}

message CodecGeneralCborFloatCompareRequest {
  CodecGeneralCborFloat left = 1;
  CodecGeneralCborFloat right = 2;
}

message CodecGeneralCborFloatProperties {
  CodecGeneralCborFloat value = 1;
  CodecGeneralCborFloatWidth shortest_width = 2;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bool finite = 3;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  bool nan = 4;
  // SENSITIVE: payload ownership requires redaction and zeroization.
  uint64 widened_binary64_bits = 5;
}

// Explicit unverified loading is only for a library built in a trusted host.
// It is a compatibility operation and never substitutes for verification.
message CodecLibraryLoadRequest {
  // SENSITIVE: payload ownership requires redaction and zeroization.
  string absolute_path = 1;
}

message CodecLoadedLibraryResult {
  CodecProviderInfo provider = 1;
}

// Host I/O adapters obtain these bytes before provider initialization. Compiled
// modules cannot satisfy this contract because their source bytes are unavailable.
message CodecWasmInitializeRequest {
  bytes module_bytes = 1;
}

// Host recovery uses only the private module cached after byte verification.
// A caller cannot supply an unverified compiled module through this operation.
message CodecWasmReinstantiateRequest {
}

