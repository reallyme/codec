version: v2
plugins:
  # Rust Buffa message/view types. This mirrors the platform workspace
  # contract-generation convention and intentionally avoids build.rs codegen.
  - local: protoc-gen-buffa
    out: crates/proto/src/generated/buffa
    opt: [views=true, json=true]
  - local: protoc-gen-buffa-packaging
    out: crates/proto/src/generated/buffa
    strategy: all

  # TypeScript package output.
  - remote: buf.build/bufbuild/es:v2.16.0
    out: packages/ts/src/proto/generated
    opt:
      - target=ts

  # Repository-level generated artifacts for consumers that vendor generated
  # protocol types directly.
  - remote: buf.build/bufbuild/es:v2.16.0
    out: gen/es
    opt:
      - target=ts
  - remote: buf.build/bufbuild/es:v2.16.0
    out: gen/es
    opt:
      - target=js
  - remote: buf.build/apple/swift:v1.38.1
    out: gen/swift
    opt:
      - Visibility=Internal
  - remote: buf.build/protocolbuffers/java:v36.2
    out: gen/java
    opt:
      - lite
  - remote: buf.build/protocolbuffers/kotlin:v36.2
    out: gen/kotlin
    opt:
      - lite
