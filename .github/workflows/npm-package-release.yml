name: npm Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.3.6

permissions:
  contents: read

concurrency:
  group: npm-package-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-release-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.resolve-release-sha.outputs.release_sha }}
    steps:
      - name: Checkout main for release SHA resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Resolve current release SHA
        id: resolve-release-sha
        run: |
          git fetch --no-tags origin main
          release_sha="$(git rev-parse origin/main)"
          if [ "$(git rev-parse origin/main)" != "${release_sha}" ]; then
            echo "::error::resolved release SHA is not the current origin/main tip"
            exit 1
          fi
          git checkout --detach "${release_sha}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_SHA=${release_sha}" >> "${GITHUB_ENV}"
          echo "Using release SHA ${release_sha}"

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Require current main and successful npm package checks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.resolve-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ATTESTATION_PREFLIGHT_WORKFLOW: npm-package-preflight.yml
          RELEASE_ATTESTATION_WAIT_SECONDS: "3600"
          RELEASE_ATTESTATION_POLL_SECONDS: "20"
        run: node scripts/verify_release_attestation.mjs

  npm-package:
    name: npm package
    needs: verify-release-sha
    runs-on: ubuntu-latest
    # Build and test run third-party build scripts and dependencies, so this
    # job holds no publish token and cannot mint an OIDC token.
    permissions:
      actions: read
      contents: read
    outputs:
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, wasm-pack
        with:
          tool: wasm-pack@0.15.1

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, wasm-bindgen-cli
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Install TypeScript codec package dependencies
        run: npm ci
        working-directory: packages/ts

      - name: Test TypeScript codec package
        run: npm test
        working-directory: packages/ts

      - name: Test TypeScript codec package in browser
        run: npm run test:browser
        working-directory: packages/ts

      # Pack the dist the tests just exercised; skipping lifecycle scripts
      # prevents prepack from rebuilding untested bytes.
      - name: Pack tested npm tarball
        id: pack
        run: |
          pack_dir="${RUNNER_TEMP}/npm-package"
          mkdir -p "${pack_dir}"
          npm pack --ignore-scripts --pack-destination "${pack_dir}"
          shopt -s nullglob
          tarballs=("${pack_dir}"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one packed tarball"
            exit 1
          fi
          tarball_sha256="$(sha256sum "${tarballs[0]}" | cut -d' ' -f1)"
          echo "tarball_sha256=${tarball_sha256}" >> "${GITHUB_OUTPUT}"
        working-directory: packages/ts

      - name: Upload tested npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-tarball
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  npm-publish:
    name: npm publish
    needs: [verify-release-sha, npm-package]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Download tested npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-tarball
          path: ${{ runner.temp }}/npm-package

      - name: Publish npm package
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is required"
            exit 1
          fi
          shopt -s nullglob
          tarballs=("${RUNNER_TEMP}"/npm-package/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one tested tarball"
            exit 1
          fi
          actual_sha256="$(sha256sum "${tarballs[0]}" | cut -d' ' -f1)"
          if [ "${actual_sha256}" != "${EXPECTED_TARBALL_SHA256}" ]; then
            echo "::error::downloaded tarball does not match the tested tarball"
            exit 1
          fi
          node scripts/verify_release_attestation.mjs
          npm publish "${tarballs[0]}" --provenance --access public --ignore-scripts
        env:
          EXPECTED_TARBALL_SHA256: ${{ needs.npm-package.outputs.tarball_sha256 }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ATTESTATION_PREFLIGHT_WORKFLOW: npm-package-preflight.yml
          RELEASE_ATTESTATION_WAIT_SECONDS: "3600"
          RELEASE_ATTESTATION_POLL_SECONDS: "20"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
