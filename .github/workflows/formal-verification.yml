name: Formal Verification

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.proofs.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  proofs:
    name: Verify bounded codec properties
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      verified_sha: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install and verify pinned Kani
        shell: bash
        run: bash scripts/install-kani-ci.sh

      - name: Verify proof obligations
        shell: bash
        working-directory: .
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
          bash -e -o pipefail scripts/check-formal.sh
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
