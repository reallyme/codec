name: Formal Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kani:
    name: Kani (${{ matrix.area }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: cbor-cid
            package: reallyme-codec-cbor
            features: ''
          - area: jcs
            package: reallyme-codec-jcs
            features: ''
          - area: tlv
            package: reallyme-codec
            features: tlv
          - area: dispatch
            package: reallyme-codec
            features: operation-contract
            harness: 'dispatch_api::proofs::'
          - area: ffi-ranges
            package: reallyme-codec-ffi
            features: ''
          - area: multicodec
            package: reallyme-codec-multicodec
            features: ''
          - area: multikey
            package: reallyme-codec-multikey
            features: ''
          - area: hex
            package: reallyme-codec-hex
            features: ''
          - area: pem
            package: reallyme-codec-pem
            features: ''
    env:
      KANI_VERSION: '0.68.0'
      KANI_BUNDLE_SHA256: 32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install and verify pinned Kani
        shell: bash
        run: |
          cargo install --locked kani-verifier --version "=$KANI_VERSION"
          bundle="kani-$KANI_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          bundle_path="$RUNNER_TEMP/$bundle"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            --output "$bundle_path" "https://github.com/model-checking/kani/releases/download/kani-$KANI_VERSION/$bundle"
          printf '%s  %s\n' "$KANI_BUNDLE_SHA256" "$bundle_path" | sha256sum --check --strict
          cargo kani setup --use-local-bundle "$bundle_path"
          cargo kani --version

      - name: Verify proof obligations
        shell: bash
        env:
          PROOF_PACKAGE: ${{ matrix.package }}
          PROOF_FEATURES: ${{ matrix.features }}
          PROOF_HARNESS: ${{ matrix.harness }}
        run: |
          cargo fetch --locked
          sha256sum Cargo.lock > "$RUNNER_TEMP/workspace-lock.sha256"
          args=(--package "$PROOF_PACKAGE" --lib --no-default-features)
          if [[ -n "$PROOF_FEATURES" ]]; then
            args+=(--features "$PROOF_FEATURES")
          fi
          if [[ -n "$PROOF_HARNESS" ]]; then
            args+=(--harness "$PROOF_HARNESS")
          fi
          results="$RUNNER_TEMP/verification.json"
          CARGO_NET_OFFLINE=true cargo kani "${args[@]}" --output-format terse \
            -Z unstable-options --export-json "$results"
          sha256sum --check --strict "$RUNNER_TEMP/workspace-lock.sha256"
          # Kani reports unmet cover goals separately from assertion failures.
          # Require evidence that each harness ran and its scenarios were reachable.
          jq --exit-status '
            .verification_results.results as $results
            | ($results | length > 0) and all($results[];
                .status == "Success"
                and ([.checks[] | select(.category == "cover")] as $covers
                  | ($covers | length > 0) and all($covers[]; .status == "Satisfied")))
          ' "$results"

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-verification-${{ matrix.area }}
          path: ${{ runner.temp }}/verification.json
          if-no-files-found: ignore
