name: Scheduled Fuzz

on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled:
    name: scheduled fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target:
          - base64url
          - dag_cbor
          - deterministic_cbor
          - general_cbor
          - der
          - der_schema
          - tlv
          - multibase
          - multicodec
          - multikey
          - operation_contract
          - jcs_text
          - guarded_json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01

      - name: Install cargo-fuzz
        run: cargo install --git https://github.com/rust-fuzz/cargo-fuzz.git --rev 984c861c8dfea28055254c5f1d2659ab2cd63f76 --locked cargo-fuzz

      - name: Seed regression corpus
        if: matrix.target == 'general_cbor' || matrix.target == 'operation_contract' || matrix.target == 'der_schema' || matrix.target == 'guarded_json'
        env:
          FUZZ_CORPUS_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$FUZZ_CORPUS_TARGET"
          cp "fuzz/seeds/$FUZZ_CORPUS_TARGET/"* "fuzz/corpus/$FUZZ_CORPUS_TARGET/"

      - name: Run time-boxed fuzz target
        env:
          FUZZ_MAX_LEN: ${{ matrix.target == 'der_schema' && '2097152' || '0' }}
        run: cargo +nightly-2026-07-01 fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096 -max_len="$FUZZ_MAX_LEN"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
