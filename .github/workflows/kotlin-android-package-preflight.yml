name: Kotlin Android Package Preflight

run-name: Preflight maven ${{ inputs.version }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.4.3
      source_sha:
        description: Full commit SHA on main used for this release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kotlin-android-package-preflight-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-source-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.source.outputs.sha }}
      ci_run_id: ${{ steps.candidate.outputs.ci_run_id }}
      android_artifact_id: ${{ steps.candidate.outputs.android_artifact_id }}
    steps:
      - name: Validate source selection
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch from main with a full source commit SHA."
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Dispatch preflight on the selected source SHA."
            exit 1
          fi
          printf 'sha=%s\n' "$SOURCE_SHA" >>"$GITHUB_OUTPUT"

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 7dffa0366a43fe9cc7b98a8040d37dd701d7955e
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Authenticate release-readiness package
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Verify dependency security for the candidate
        run: node scripts/verify_release_dependency_security.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}

      - name: Verify unused release slot across registries
        run: node scripts/verify_release_availability.mjs "$RELEASE_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Verify release candidate
        id: candidate
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release maven preflight "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}

      - name: Record verified CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness-ci-${{ github.run_attempt }}-${{ steps.candidate.outputs.ci_run_id }}
          path: ${{ runner.temp }}/release-readiness-ci.json
          if-no-files-found: error
          retention-days: 7

  jvm-native:
    name: jvm native preflight ${{ matrix.platform }}
    needs: verify-source-sha
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Stage codec JNI resource
        run: scripts/build_kotlin_native_resource.sh build/kotlin-native-resources
        shell: bash

      - name: Write host native integrity metadata
        run: node scripts/write_native_manifest.mjs build/kotlin-native-resources build/kotlin-native-resources/me/really/codec/native/native-manifest.json
        shell: bash

      - name: Test host native loader
        working-directory: packages/kotlin
        run: ./gradlew test -Preallyme.codec.nativeResourcesDir=../../build/kotlin-native-resources
        shell: bash

      - name: Upload codec JNI resource
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-native-${{ matrix.platform }}
          path: build/kotlin-native-resources
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  kotlin-package:
    name: kotlin maven preflight
    needs: [verify-source-sha, jvm-native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Download codec JNI resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kotlin-native-*
          path: build/kotlin-native-resources
          merge-multiple: true

      - name: Write native checksum manifest
        run: node scripts/write_native_manifest.mjs build/kotlin-native-resources build/kotlin-native-resources/me/really/codec/native/native-manifest.json

      - name: Test and stage JVM Maven publication
        working-directory: packages/kotlin
        run: ./gradlew test publishAllPublicationsToLocalReleaseRepository -Preallyme.maven.localReleaseRepositoryDir="$MAVEN_REPOSITORY" -Preallyme.codec.nativeResourcesDir=${{ github.workspace }}/build/kotlin-native-resources -Preallyme.codec.requireFullNativeResources=true
        env:
          MAVEN_REPOSITORY: ${{ runner.temp }}/maven-jvm

      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-jvm-${{ inputs.version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: ${{ runner.temp }}/maven-jvm/
          if-no-files-found: error
          overwrite: true
          retention-days: 7


  android-package:
    name: Retain tested Android Maven publication
    needs: verify-source-sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 7dffa0366a43fe9cc7b98a8040d37dd701d7955e
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Authenticate release-readiness package
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Download tested Android publication
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify-source-sha.outputs.android_artifact_id }}
          run-id: ${{ needs.verify-source-sha.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/android-publication

      - name: Verify tested Android publication
        run: node .release-readiness/scripts/android-runtime.mjs verify-publication "$RUNNER_TEMP/android-publication/repository" "$SOURCE_SHA" "$RELEASE_VERSION"
        env:
          SOURCE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Upload tested Android publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-android-${{ inputs.version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: ${{ runner.temp }}/android-publication/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
