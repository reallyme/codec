name: Fuzz

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.build.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  build:
    name: fuzz target build
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01

      - name: Verify fuzz lockfile is current
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null

      - name: Install cargo-fuzz
        run: cargo install --git https://github.com/rust-fuzz/cargo-fuzz.git --rev 984c861c8dfea28055254c5f1d2659ab2cd63f76 --locked cargo-fuzz

      - name: Build fuzz targets
        run: cargo +nightly-2026-07-01 fuzz build

      - name: Replay operation contract regression
        run: cargo +nightly-2026-07-01 fuzz run operation_contract fuzz/seeds/operation_contract/provider_info.json

      - name: Replay caller-supplied DER schema regressions
        run: cargo +nightly-2026-07-01 fuzz run der_schema fuzz/seeds/der_schema -- -runs=0 -max_len=2097152

      - name: Record verified source
        id: verified
        shell: bash
        run: |
          sha=$(git rev-parse --verify HEAD)
          test "$sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >>"$GITHUB_OUTPUT"
