name: Swift Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.4.4
      source_sha:
        description: Copy the full source SHA from the successful Swift Package Preflight summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swift-package-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-release-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.source.outputs.sha }}
      preflight_run_id: ${{ steps.candidate.outputs.preflight_run_id }}
      package_artifact_ids: ${{ steps.candidate.outputs.package_artifact_ids }}
    steps:
      - name: Validate source selection
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch from main with a full source commit SHA."
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            # Validate ancestry before checking out or executing candidate code.
            on_main="$(gh api --hostname github.com \
              "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$GITHUB_SHA?per_page=1" \
              --jq '(.status == "ahead" or .status == "identical") and .behind_by == 0')"
            if [[ "$on_main" != true ]]; then
              echo "::error::Selected source SHA is outside the dispatch commit's main history."
              exit 1
            fi
          fi
          printf 'sha=%s\n' "$SOURCE_SHA" >>"$GITHUB_OUTPUT"

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: a89da82a662e02ecb3b7cfc6756c450aff64417a
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Authenticate release-readiness package
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Reject private files in release source history
        run: node scripts/check_ignored_files.mjs --history

      - name: Verify release candidate
        id: candidate
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release swift publish "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}

  swift-verify:
    name: SwiftPM artifact verification
    needs: verify-release-sha
    runs-on: macos-26
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-release-sha.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          merge-multiple: true
          path: build/swift


      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Select Xcode 26.4 for Swift verification
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app
          swift --version

      - name: Check package contents for private local files
        run: python3 scripts/check_release_privacy.py build/swift/ReallyMeCodecFFI.xcframework.zip build/swift/ReallyMeCodecFFI.xcframework.checksum

      - name: Bind manifest to attested Swift artifact
        run: |
          checksum="$(cat build/swift/ReallyMeCodecFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Verify SwiftPM manifest and downloaded artifact
        run: |
          node scripts/verify_swift_release_artifact.mjs build/swift/ReallyMeCodecFFI.xcframework.zip build/swift/ReallyMeCodecFFI.xcframework.checksum Package.swift "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

  swift-release:
    name: SwiftPM release tag
    needs: [verify-release-sha, swift-verify]
    runs-on: macos-26
    environment: github-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          fetch-depth: 0

      - name: Download verified Swift artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-release-sha.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          merge-multiple: true
          path: build/swift


      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Select Xcode 26.4 for Swift release
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app
          swift --version

      - name: Check package contents for private local files
        run: python3 scripts/check_release_privacy.py build/swift/ReallyMeCodecFFI.xcframework.zip build/swift/ReallyMeCodecFFI.xcframework.checksum

      - name: Bind release manifest to verified Swift artifact
        run: |
          checksum="$(cat build/swift/ReallyMeCodecFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Create immutable GitHub release with Swift artifact
        run: |
          node scripts/verify_swift_release_artifact.mjs build/swift/ReallyMeCodecFFI.xcframework.zip build/swift/ReallyMeCodecFFI.xcframework.checksum Package.swift "${RELEASE_VERSION}"
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::GitHub release v${RELEASE_VERSION} already exists"
            exit 1
          fi
          if ! git diff --quiet -- . ':(exclude)Package.swift'; then
            echo "::error::Swift release preparation modified files other than Package.swift"
            exit 1
          fi
          tag_target="${RELEASE_SHA}"
          if ! git diff --quiet -- Package.swift; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Package.swift
            release_commit_date="$(git show -s --format=%cI "${RELEASE_SHA}")"
            GIT_AUTHOR_DATE="${release_commit_date}" GIT_COMMITTER_DATE="${release_commit_date}" \
              git commit -m "Bind Swift artifact for v${RELEASE_VERSION}"
            tag_target="$(git rev-parse HEAD)"
          fi
          existing_tag_target="$(git ls-remote --tags origin "refs/tags/v${RELEASE_VERSION}" | cut -f1)"
          if [ -n "${existing_tag_target}" ] && [ "${existing_tag_target}" != "${tag_target}" ]; then
            echo "::error::Git tag v${RELEASE_VERSION} already targets a different commit"
            exit 1
          fi
          if [ -z "${existing_tag_target}" ]; then
            git tag "v${RELEASE_VERSION}" "${tag_target}"
            git push origin "refs/tags/v${RELEASE_VERSION}"
          fi
          gh release create "v${RELEASE_VERSION}" \
            build/swift/ReallyMeCodecFFI.xcframework.zip \
            build/swift/ReallyMeCodecFFI.xcframework.checksum \
            --verify-tag \
            --title "ReallyMe Codec v${RELEASE_VERSION}" \
            --notes "ReallyMe Codec package release v${RELEASE_VERSION}."
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
