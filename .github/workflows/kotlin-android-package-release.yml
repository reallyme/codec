name: Kotlin Android Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.4.2
      source_sha:
        description: Full commit SHA on main used for this release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kotlin-android-package-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-release-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.source.outputs.sha }}
      preflight_run_id: ${{ steps.candidate.outputs.preflight_run_id }}
      package_artifact_ids: ${{ steps.candidate.outputs.package_artifact_ids }}
    steps:
      - name: Validate source selection
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch from main with a full source commit SHA."
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            # Validate ancestry before checking out or executing candidate code.
            on_main="$(gh api --hostname github.com \
              "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$GITHUB_SHA?per_page=1" \
              --jq '(.status == "ahead" or .status == "identical") and .behind_by == 0')"
            if [[ "$on_main" != true ]]; then
              echo "::error::Selected source SHA is outside the dispatch commit's main history."
              exit 1
            fi
          fi
          printf 'sha=%s\n' "$SOURCE_SHA" >>"$GITHUB_OUTPUT"

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 7dffa0366a43fe9cc7b98a8040d37dd701d7955e
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Authenticate release-readiness package
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Verify release candidate
        id: candidate
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release maven publish "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}

  maven-package:
    name: Promote tested Maven publications
    needs: verify-release-sha
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 7dffa0366a43fe9cc7b98a8040d37dd701d7955e
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Authenticate release-readiness package
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-release-sha.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-package

      - name: Verify tested Android publication
        run: node .release-readiness/scripts/android-runtime.mjs verify-publication "$RUNNER_TEMP/release-package/maven-android-$RELEASE_VERSION-$SOURCE_SHA/repository" "$SOURCE_SHA" "$RELEASE_VERSION"
        env:
          SOURCE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Sign and publish verified Maven packages
        run: scripts/promote_maven_publications.sh "$RUNNER_TEMP/release-package" "$RELEASE_VERSION" "$SOURCE_SHA"
        env:
          SOURCE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.REALLYME_MAVEN_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.REALLYME_MAVEN_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
