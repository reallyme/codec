name: Protobuf Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/protobuf-ci.yml"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "crates/proto/**"
      - "packages/ts/src/proto/**"
      - "gen/**"
      - "scripts/check_release_readiness.mjs"
      - "scripts/run_pinned_release_readiness.mjs"
      - "scripts/release-readiness/core.mjs"
      - "scripts/release-readiness/source-policy.mjs"
      - "scripts/codec_proto_sensitivity.mjs"
      - "scripts/redact_codec_proto_debug.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/protobuf-ci.yml"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "crates/proto/**"
      - "packages/ts/src/proto/**"
      - "gen/**"
      - "scripts/check_release_readiness.mjs"
      - "scripts/run_pinned_release_readiness.mjs"
      - "scripts/release-readiness/core.mjs"
      - "scripts/release-readiness/source-policy.mjs"
      - "scripts/codec_proto_sensitivity.mjs"
      - "scripts/redact_codec_proto_debug.mjs"

permissions:
  contents: read

env:
  BUFFA_VERSION: 0.9.1
  BUF_VERSION: 1.72.0

jobs:
  protobuf:
    name: lint, breaking, generated freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.96.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Install pinned Buffa generators
        run: |
          cargo install protoc-gen-buffa --version "$BUFFA_VERSION" --locked
          cargo install protoc-gen-buffa-packaging --version "$BUFFA_VERSION" --locked

      - name: Fetch main for breaking-change comparison
        run: git fetch origin main:refs/remotes/origin/main

      - name: Check protobuf breaking changes
        run: buf breaking --against '.git#branch=origin/main'

      - name: Check release readiness generated freshness
        run: node scripts/run_pinned_release_readiness.mjs --generated-freshness
