name: Protobuf Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BUFFA_VERSION: 0.9.2
  BUF_VERSION: 1.73.0

jobs:
  protobuf:
    name: lint, breaking, generated freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: ${{ env.BUF_VERSION }}
          checksum: 8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1
          github_token: ${{ github.token }}
          setup_only: true

      - name: Install pinned Buffa generators
        run: |
          cargo install protoc-gen-buffa --version "$BUFFA_VERSION" --locked
          cargo install protoc-gen-buffa-packaging --version "$BUFFA_VERSION" --locked

      - name: Fetch main and published tags for breaking-change comparison
        run: git fetch origin main:refs/remotes/origin/main --tags

      - name: Check protobuf breaking changes
        run: |
          release_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [ -z "${release_tag}" ]; then
            echo "::error::no published version tag is available for protobuf comparison"
            exit 1
          fi
          buf breaking --against ".git#tag=${release_tag}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            buf breaking --against '.git#branch=origin/main'
          fi

      - name: Check release readiness generated freshness
        run: node scripts/run_pinned_release_readiness.mjs --generated-freshness
