name: Protobuf Checks

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.protobuf.outputs.verified_sha }}

permissions:
  contents: read

env:
  BUF_VERSION: 1.75.0

jobs:
  protobuf:
    name: Protobuf compatibility
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install buf
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: ${{ env.BUF_VERSION }}
          checksum: f71b009ebd8530b12fd85b060c6c245e15d6e5110ccc8da48d8b6fa71e59330b
          github_token: ${{ github.token }}
          setup_only: true

      - name: Fetch main and published tags for breaking-change comparison
        run: git fetch origin main:refs/remotes/origin/main --tags

      - name: Check protobuf breaking changes
        run: |
          release_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [ -z "${release_tag}" ]; then
            echo "::error::no published version tag is available for protobuf comparison"
            exit 1
          fi
          buf breaking --against ".git#tag=${release_tag}"
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            buf breaking --against '.git#branch=origin/main'
          fi

      - name: Record verified source
        id: verified
        shell: bash
        run: |
          sha=$(git rev-parse --verify HEAD)
          test "$sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >>"$GITHUB_OUTPUT"
