name: Swift Package Preflight

run-name: Preflight swift ${{ inputs.version }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.4.5
      source_sha:
        description: Full commit SHA on main used for this release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swift-package-preflight-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-source-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate source selection
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch from main with a full source commit SHA."
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Dispatch preflight on the selected source SHA."
            exit 1
          fi
          printf 'sha=%s\n' "$SOURCE_SHA" >>"$GITHUB_OUTPUT"

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install dependency maintenance tools
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.23.0,cargo-outdated@0.19.0
          fallback: none

      - name: Authenticate release-readiness package
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Reject private files in release source history
        run: node scripts/check_ignored_files.mjs --history

      - name: Verify dependency security for the candidate
        run: node scripts/verify_release_dependency_security.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}

      - name: Verify unused release slot across registries
        run: node scripts/verify_release_availability.mjs "$RELEASE_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Verify release candidate
        id: candidate
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release swift preflight "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: ${{ runner.temp }}/release-readiness-ci.json
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Record verified CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness-ci-${{ github.run_attempt }}-${{ steps.candidate.outputs.ci_run_id }}
          path: ${{ runner.temp }}/release-readiness-ci.json
          if-no-files-found: error
          retention-days: 7

  swift-package:
    name: swift package preflight
    needs: verify-source-sha
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Check Swift Build toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Verify release version across package manifests
        run: node scripts/verify_release_version.mjs "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      # Code Checks covers the runtime-loaded provider for this exact SHA.
      # Preflight exercises the distinct linked provider and its release archive.
      - name: Build SwiftPM binary artifact
        run: scripts/build_swift_xcframework.sh

      - name: Bind manifest to Swift release candidate
        run: |
          checksum="$(cat build/swift/ReallyMeCodecFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Verify generated SwiftPM manifest and release candidate
        run: |
          node scripts/verify_swift_release_artifact.mjs build/swift/ReallyMeCodecFFI.xcframework.zip build/swift/ReallyMeCodecFFI.xcframework.checksum Package.swift "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Test SwiftPM consumer with two binary targets
        timeout-minutes: 15
        run: bash scripts/test_swift_xcframework_consumer.sh build/swift/ReallyMeCodecFFI.xcframework.zip

      - name: Prepare local SwiftPM binary manifest
        run: |
          checksum="$(cat build/swift/ReallyMeCodecFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}" --local-artifact-path build/swift/ReallyMeCodecFFI.xcframework
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Test Swift package with linked binary target
        timeout-minutes: 20
        run: |
          # Stage the host dylib at the loader tests' default fixture path.
          # Linked-provider tests require the library override to be unset.
          mkdir -p target/debug
          cp target/aarch64-apple-darwin/release/libreallyme_codec_ffi.dylib target/debug/
          swift test --arch arm64 --verbose

      # Publication promotes the exact archive tested by both the binary
      # consumer and the linked-provider suite.
      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: |
            build/swift/ReallyMeCodecFFI.xcframework.zip
            build/swift/ReallyMeCodecFFI.xcframework.checksum
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Upload Swift release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-xcframework-${{ inputs.version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: |
            build/swift/ReallyMeCodecFFI.xcframework.zip
            build/swift/ReallyMeCodecFFI.xcframework.checksum
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Show release form inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          SHA_PATTERN: '^[0-9a-f]{40}$'
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$SOURCE_SHA" != "$GITHUB_SHA" || ! "$SOURCE_SHA" =~ $SHA_PATTERN ||
                ! "$RELEASE_VERSION" =~ $VERSION_PATTERN ]]; then
            echo "::warning::Cannot show release inputs without a matching preflight dispatch on main." >&2
            exit 0
          fi
          if [[ -z "$GITHUB_STEP_SUMMARY" ]]; then
            echo "::warning::GitHub Actions did not provide a job summary file." >&2
            exit 0
          fi
          if ! printf '%s\n' '## Release form inputs' '' \
              'Copy these values into the release form for this ecosystem once the preflight run succeeds.' '' \
              '**Version**' '```text' "$RELEASE_VERSION" '```' '' \
              '**Source SHA**' '```text' "$SOURCE_SHA" '```' >>"$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Could not write release inputs to the GitHub Actions summary." >&2
          fi
