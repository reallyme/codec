name: Code Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Separate event types and push commits so fresh checks do not wait for an
# obsolete commit while a manual run cannot cancel a required push check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-policy:
    name: repository policy and tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Portable tooling shares the Intel pool with sanitizers. Swift retains
        # ARM execution without making these jobs compete for ARM capacity.
        os: [ubuntu-24.04, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Verify release readiness pins before testing
        if: matrix.os != 'ubuntu-24.04'
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      # The local digest pin cannot prove where the vendored core came from.
      # One bounded fetch on one lane, without retries, ties it to the pinned
      # upstream commit; every other lane and the release gate stay offline.
      - name: Verify vendored readiness core against upstream
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/run_pinned_release_readiness.mjs --check-pins --verify-upstream

      - name: Install ShellCheck
        if: matrix.os == 'ubuntu-24.04'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: shellcheck@0.11.0

      - name: Install actionlint
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/install_actionlint.sh

      - name: Lint workflows
        if: matrix.os == 'ubuntu-24.04'
        run: actionlint

      # Globs include new regression suites without a second hand-maintained list.
      - name: Test repository scripts and browser tooling
        run: node --test --test-concurrency=4 "scripts/**/*.test.mjs" "packages/ts/scripts/*.test.mjs"

      - name: Test Gradle policy tools
        run: python3 -m unittest discover -s scripts -p '*_test.py'

  rust:
    name: fmt, lint, test, wasm, package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, nextest
        with:
          tool: cargo-nextest@0.9.151

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, cargo-deny
        with:
          tool: cargo-deny@0.20.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, cargo-audit
        with:
          tool: cargo-audit@0.23.0

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, wasm-pack
        with:
          tool: wasm-pack@0.15.1

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, wasm-bindgen-cli
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json

      - name: Release readiness
        run: node scripts/run_pinned_release_readiness.mjs

      - name: Format
        run: cargo fmt --check

      - name: Check warnings as errors
        run: RUSTFLAGS=-Dwarnings cargo check --workspace --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo nextest run --workspace --all-features --locked

      - name: Check codec feature subsets
        run: |
          cargo test -p reallyme-codec --no-default-features --all-targets --locked
          for feature in base64 base64url cbor der hex jcs multibase multicodec multikey pem operation-contract serde; do
            cargo test -p reallyme-codec --no-default-features --features "$feature" --all-targets --locked
          done

      - name: Test JCS under serde_json feature unification
        run: cargo test --manifest-path probes/jcs-feature-unification/Cargo.toml --locked

      - name: Test DER under BER feature unification
        run: cargo test --manifest-path probes/der-feature-unification/Cargo.toml --locked

      - name: Doc build
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Doctests
        run: cargo test --workspace --all-features --doc --locked

      - name: Check codec WASM crate
        run: |
          cargo check -p reallyme-codec-wasm --target wasm32-unknown-unknown --locked
          cargo check -p reallyme-codec --no-default-features --features der --target wasm32-unknown-unknown --locked

      - name: Install TypeScript codec package dependencies
        run: npm ci --prefix packages/ts

      - name: Audit production npm dependencies
        run: npm audit --prefix packages/ts --omit=dev --audit-level=high

      - name: Test TypeScript codec package
        run: npm --prefix packages/ts test

      - name: Test TypeScript codec package in browser
        # Exercise the same dist as the Node tests; do not rebuild it here.
        run: npm --prefix packages/ts run test:browser:built

      - name: Dependency policy
        run: cargo deny check

      - name: Security advisory audit
        run: scripts/audit_committed_lockfiles.sh

  native-sanitizers:
    name: native sanitizer lanes
    # Keep this portable lane off the capacity-constrained ARM pool. The Swift
    # lane still exercises ARM macOS; sanitizer tests also cover Intel macOS.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust sanitizer toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01

      - name: Test native sanitizer lanes
        run: scripts/test_native_sanitizers.sh

  ffi-abi-artifact:
    name: FFI release artifact and C sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Verify release artifact through C sanitizer harness
        run: scripts/test_ffi_abi_release_artifact.sh

  ffi-miri:
    name: FFI Miri tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Miri toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01
          components: miri

      - name: Run FFI Miri tests
        # Cap-sized allocation tests run under nextest; Miri targets the unsafe
        # pointer and unwind boundaries where its interpreter adds coverage.
        run: |
          cargo +nightly-2026-07-01 miri test -p reallyme-codec-ffi --lib pointer::tests --locked
          cargo +nightly-2026-07-01 miri test -p reallyme-codec-ffi --lib guard::tests --locked
          cargo +nightly-2026-07-01 miri test -p reallyme-codec --no-default-features --features der --test der_canonical_tests --locked
          cargo +nightly-2026-07-01 miri test -p reallyme-codec-cbor --test general_tests semantic_equivalent_keys_are_rejected_without_sorting --locked
          cargo +nightly-2026-07-01 miri test -p reallyme-codec-cbor --test general_zeroization_tests --locked

  # Run Swift against the Rust provider without the traced-build overhead.
  swift:
    name: swift codec package
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Select Xcode 26.4
        run: |
          developer_dir=$(cd /Applications/Xcode_26.4.app/Contents/Developer && pwd -P)
          sudo xcode-select -s "$developer_dir"
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"
          printf '%s/Toolchains/XcodeDefault.xctoolchain/usr/bin\n' "$developer_dir" >> "$GITHUB_PATH"
          uname -m
          test "$(uname -m)" = arm64
          xcodebuild -version
          "$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift" --version

      - name: Build codec FFI dylib
        run: cargo build --locked -p reallyme-codec-ffi

      - name: Test Swift package
        timeout-minutes: 20
        run: swift test --arch arm64 --verbose
        env:
          REALLYME_CODEC_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/debug/libreallyme_codec_ffi.dylib
          REALLYME_CODEC_SWIFTPM_RUNTIME_FFI: "1"

  kotlin:
    name: kotlin codec package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Gradle dependency provenance
        run: python3 scripts/verify_gradle_checksum_provenance.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Build codec FFI dylib
        run: cargo build --locked -p reallyme-codec-ffi

      - name: Test Kotlin codec package
        working-directory: packages/kotlin
        run: ./gradlew test
        env:
          REALLYME_CODEC_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/debug/libreallyme_codec_ffi.so
