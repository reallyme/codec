name: Code Checks

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.verified.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  repository-policy:
    name: repository policy and tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Portable tooling shares the Intel pool with sanitizers. Swift retains
        # ARM execution without making these jobs compete for ARM capacity.
        os: [ubuntu-24.04, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 55115f21d5bf9a3fbc1bb8d10484aecba6e7bd8f
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Verify release readiness pins before testing
        if: matrix.os != 'ubuntu-24.04'
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      # Corroborate the verified checkout against the immutable upstream
      # source once. Other lanes use their local digest checks.
      - name: Verify pinned readiness core against upstream
        if: matrix.os == 'ubuntu-24.04'
        run: node scripts/run_pinned_release_readiness.mjs --check-pins --verify-upstream

      - name: Install ShellCheck
        if: matrix.os == 'ubuntu-24.04'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: shellcheck@0.11.0

      - name: Install actionlint
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/install_actionlint.sh

      - name: Lint workflows
        if: matrix.os == 'ubuntu-24.04'
        run: actionlint

      # Globs include new regression suites without a second hand-maintained list.
      - name: Test repository scripts and browser tooling
        run: node --test --test-concurrency=4 "scripts/**/*.test.mjs" "packages/ts/scripts/*.test.mjs"

      - name: Test Gradle policy tools
        run: python3 -m unittest discover -s scripts -p '*_test.py'

  rust:
    name: fmt, lint, test, wasm, package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Separate this cache from entries containing unmanaged Cargo tools.
          key: rust-dependencies
          cache-bin: false

      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, nextest
        with:
          tool: cargo-nextest@0.9.151

      - name: Install cargo-deny
        run: cargo +1.100.0 install cargo-deny --version '=0.20.2' --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, cargo-audit
        with:
          tool: cargo-audit@0.23.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json

      - name: Format
        run: cargo fmt --check

      - name: Check warnings as errors
        run: RUSTFLAGS=-Dwarnings cargo check --workspace --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo nextest run --workspace --all-features --locked

      - name: Test on the release toolchain
        run: cargo +1.100.0 test --locked --workspace --all-features

      - name: Check codec feature subsets
        run: |
          cargo test -p reallyme-codec --no-default-features --all-targets --locked
          for feature in base64 base64url cbor der hex jcs multibase multicodec multikey pem operation-contract serde; do
            cargo test -p reallyme-codec --no-default-features --features "$feature" --all-targets --locked
          done

      - name: Test JCS under serde_json feature unification
        run: cargo test --manifest-path probes/jcs-feature-unification/Cargo.toml --locked

      - name: Test DER under BER feature unification
        run: cargo test --manifest-path probes/der-feature-unification/Cargo.toml --locked

      - name: Doc build
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Doctests
        run: cargo test --workspace --all-features --doc --locked

      - name: Check codec WASM crate
        run: |
          cargo check -p reallyme-codec-wasm --target wasm32-unknown-unknown --locked
          cargo check -p reallyme-codec --no-default-features --features der --target wasm32-unknown-unknown --locked

      - name: Install TypeScript codec package dependencies
        run: npm ci --prefix packages/ts

      - name: Audit production npm dependencies
        run: npm audit --prefix packages/ts --omit=dev --audit-level=high

      - name: Dependency policy
        run: cargo +1.100.0 deny --locked --workspace --all-features --config deny.toml check advisories licenses sources

      - name: Security advisory audit
        run: scripts/audit_committed_lockfiles.sh

  rust-msrv:
    name: Test publishable crates on Rust 1.96.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test reallyme-codec at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec --all-features
      - name: Test reallyme-codec-base64 at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec-base64 --all-features
      - name: Test reallyme-codec-base64url at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec-base64url --all-features
      - name: Test reallyme-codec-cbor at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec-cbor --all-features
      - name: Test reallyme-codec-hex at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec-hex --all-features
      - name: Test reallyme-codec-jcs at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec-jcs --all-features
      - name: Test reallyme-codec-multibase at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec-multibase --all-features
      - name: Test reallyme-codec-multicodec at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec-multicodec --all-features
      - name: Test reallyme-codec-multikey at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec-multikey --all-features
      - name: Test reallyme-codec-pem at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec-pem --all-features
      - name: Test reallyme-codec-proto at MSRV
        run: cargo +1.96.0 test --locked --package reallyme-codec-proto --all-features

  native-sanitizers:
    name: native sanitizer lanes
    # Keep this portable lane off the capacity-constrained ARM pool. The Swift
    # lane still exercises ARM macOS; sanitizer tests also cover Intel macOS.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust sanitizer toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01

      - name: Test native sanitizer lanes
        run: scripts/test_native_sanitizers.sh

  ffi-abi-artifact:
    name: FFI release artifact and C sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Verify release artifact through C sanitizer harness
        run: scripts/test_ffi_abi_release_artifact.sh

  ffi-miri:
    name: FFI Miri tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Miri toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01
          components: miri

      - name: Run FFI Miri tests
        # Cap-sized allocation tests run under nextest; Miri targets the unsafe
        # pointer and unwind boundaries where its interpreter adds coverage.
        run: |
          cargo +nightly-2026-07-01 miri test -p reallyme-codec-ffi --lib pointer::tests --locked
          cargo +nightly-2026-07-01 miri test -p reallyme-codec-ffi --lib guard::tests --locked
          cargo +nightly-2026-07-01 miri test -p reallyme-codec --no-default-features --features der --test der_canonical_tests --locked
          cargo +nightly-2026-07-01 miri test -p reallyme-codec-cbor --test general_tests semantic_equivalent_keys_are_rejected_without_sorting --locked
          cargo +nightly-2026-07-01 miri test -p reallyme-codec-cbor --test general_zeroization_tests --locked

  kotlin:
    name: kotlin codec package on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Gradle dependency provenance
        run: python3 scripts/verify_gradle_checksum_provenance.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install Node for JNI resource staging
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Build and stage Linux JNI library
        run: |
          scripts/build_kotlin_native_resource.sh build/sdk-native-resources
          node scripts/write_native_manifest.mjs build/sdk-native-resources build/sdk-native-resources/me/really/codec/native/native-manifest.json

      - name: Test Kotlin codec package
        working-directory: packages/kotlin
        run: ./gradlew test "-Preallyme.codec.nativeResourcesDir=${{ github.workspace }}/build/sdk-native-resources"
        env:
          REALLYME_CODEC_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/release/libreallyme_codec_ffi.so
  verified:
    name: Record verified code checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - repository-policy
      - rust
      - rust-msrv
      - native-sanitizers
      - ffi-abi-artifact
      - ffi-miri
      - kotlin
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Record verified source
        id: verified
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: printf 'sha=%s\n' "$SOURCE_SHA" >>"$GITHUB_OUTPUT"
