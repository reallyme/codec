name: Code Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: fmt, lint, test, wasm, package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, nextest
        with:
          tool: cargo-nextest@0.9.143

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, cargo-deny
        with:
          tool: cargo-deny@0.20.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, cargo-audit
        with:
          tool: cargo-audit@0.22.2

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, wasm-pack
        with:
          tool: wasm-pack@0.15.0

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3, wasm-bindgen-cli
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json

      - name: Format
        run: cargo fmt --check

      - name: Check all features
        run: cargo check --workspace --all-features --locked

      - name: Check warnings as errors
        run: RUSTFLAGS=-Dwarnings cargo check --workspace --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo nextest run --workspace --all-features --locked

      - name: Check codec feature subsets
        run: |
          cargo test -p reallyme-codec --no-default-features --all-targets --locked
          for feature in base64 base64url cbor hex jcs multibase multicodec multikey pem operation-contract serde; do
            cargo test -p reallyme-codec --no-default-features --features "$feature" --all-targets --locked
          done

      - name: Test JCS under serde_json feature unification
        run: cargo test --manifest-path probes/jcs-feature-unification/Cargo.toml --locked

      - name: Doc build
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Doctests
        run: cargo test --workspace --all-features --doc --locked

      - name: Check codec WASM crate
        run: cargo check -p reallyme-codec-wasm --target wasm32-unknown-unknown --locked

      - name: Install TypeScript codec package dependencies
        run: npm ci --prefix packages/ts

      - name: Audit production npm dependencies
        run: npm audit --prefix packages/ts --omit=dev --audit-level=high

      - name: Test TypeScript codec package
        run: npm --prefix packages/ts test

      - name: Test browser DevTools startup parsing
        run: node --test packages/ts/scripts/chrome-devtools-port.test.mjs

      - name: Test TypeScript codec package in browser
        run: npm --prefix packages/ts run test:browser

      - name: Test release-readiness CLI
        run: node --test scripts/release-readiness/cli.test.mjs

      - name: Test architecture source policy
        run: node --test scripts/release-readiness/source-policy.test.mjs

      - name: Test native manifest integrity metadata
        run: node --test scripts/write_native_manifest.test.mjs

      - name: Test release attestation policy
        run: node --test scripts/verify_release_attestation.test.mjs

      - name: Test release version policy
        run: node --test scripts/verify_release_version.test.mjs

      - name: Test release availability policy
        run: node --test scripts/verify_release_availability.test.mjs

      - name: Test Maven Central upload protocol
        run: node --test scripts/upload_maven_central_bundle.test.mjs

      - name: Test Swift release artifact verification
        run: node --test scripts/verify_swift_release_artifact.test.mjs

      - name: Test build and release scripts
        run: node --test scripts/tooling.test.mjs

      - name: Release readiness
        run: node scripts/run_pinned_release_readiness.mjs

      - name: Dependency policy
        run: cargo deny check

      - name: Security advisory audit
        run: scripts/audit_committed_lockfiles.sh

  native-sanitizers:
    name: native sanitizer lanes
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust sanitizer toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01

      - name: Test native sanitizer lanes
        run: scripts/test_native_sanitizers.sh

  ffi-abi-artifact:
    name: FFI release artifact and C sanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0

      - name: Verify release artifact through C sanitizer harness
        run: scripts/test_ffi_abi_release_artifact.sh

  ffi-miri:
    name: FFI Miri tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Miri toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01
          components: miri

      - name: Run FFI Miri tests
        # Cap-sized allocation tests run under nextest; Miri targets the unsafe
        # pointer and unwind boundaries where its interpreter adds coverage.
        run: |
          cargo +nightly-2026-07-01 miri test -p reallyme-codec-ffi --lib pointer::tests --locked
          cargo +nightly-2026-07-01 miri test -p reallyme-codec-ffi --lib guard::tests --locked

  swift:
    name: swift codec package
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0

      - name: Select Xcode 26.4
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app
          swift --version

      - name: Build codec FFI dylib
        run: cargo build --locked -p reallyme-codec-ffi

      - name: Test Swift package
        run: swift test
        env:
          REALLYME_CODEC_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/debug/libreallyme_codec_ffi.dylib
          REALLYME_CODEC_SWIFTPM_RUNTIME_FFI: "1"

  kotlin:
    name: kotlin codec package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Gradle dependency provenance
        run: python3 scripts/verify_gradle_checksum_provenance.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0

      - name: Build codec FFI dylib
        run: cargo build --locked -p reallyme-codec-ffi

      - name: Test Kotlin codec package
        working-directory: packages/kotlin
        run: ./gradlew test
        env:
          REALLYME_CODEC_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/debug/libreallyme_codec_ffi.so
