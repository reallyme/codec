name: Crates Package Preflight

run-name: Crates package preflight ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional exact main commit SHA to certify. Leave blank to use current origin/main.
        required: false
        type: string
        default: ""
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.3.0

permissions:
  contents: read

concurrency:
  group: crates-package-preflight-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-source-sha:
    name: verify source SHA
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.resolve-release-sha.outputs.release_sha }}
    steps:
      - name: Checkout main for release SHA resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Resolve release SHA
        id: resolve-release-sha
        env:
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        run: |
          git fetch --no-tags origin main
          if [ -n "${RELEASE_SHA_INPUT}" ]; then
            if [[ ! "${RELEASE_SHA_INPUT}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::release_sha must be blank or a lowercase 40-character commit SHA"
              exit 1
            fi
            release_sha="${RELEASE_SHA_INPUT}"
          else
            release_sha="$(git rev-parse origin/main)"
          fi
          if [ "$(git rev-parse origin/main)" != "${release_sha}" ]; then
            echo "::error::resolved release SHA is not the current origin/main tip"
            exit 1
          fi
          git checkout --detach "${release_sha}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "Using release SHA ${release_sha}"

  crates-package:
    name: crates.io package preflight
    needs: verify-source-sha
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # cargo-audit
        with:
          tool: cargo-audit@0.22.2

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Verify release version across package manifests
        run: node scripts/verify_release_version.mjs "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Verify unused release slot across registries
        run: node scripts/verify_release_availability.mjs "${RELEASE_VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Check workspace metadata
        run: cargo metadata --format-version 1 --no-deps

      - name: Security advisory audit
        run: scripts/audit_committed_lockfiles.sh

      - name: Check release version matches crate metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          release_version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' crates/codec/Cargo.toml | head -n 1)"
          if [ "${release_version}" != "${RELEASE_VERSION}" ]; then
            echo "::error::release version input does not match crates/codec/Cargo.toml"
            exit 1
          fi

      - name: Inspect publishable crate tarballs
        run: node scripts/publish_crates_in_order.mjs inspect

      - name: Check release readiness contract
        run: node scripts/run_pinned_release_readiness.mjs
